id = "witwin.channel"
name = "Channel"
version = "0.1.0"
author = ""
description = "Radio channel radiomap solver with 2D visualization."
license = "GPL-3.0-or-later"
repository = "https://github.com/witwin-ai/wt_channel"
dependencies = ["scipy", "numpy"]
icon = "radio"
enabled = true

[engines]
witwin = "^1.0.0"

[[contributes.tools]]
module = "agent_tools"
register = "register"

[[contributes.skills]]
root = "skills"

[permissions]
tools = ["scene_write"]

[[contributes.solvers]]
id = "witwin.channel.radiomap"
title = "Channel RadioMap"
entry = "solver_host.py"
lifecycle = "warm"
idleTimeoutSec = 300
cancelGraceSec = 5
maxParallel = 1

[contributes.solvers.runtime]
python = "${project:python}"

[contributes.solvers.capabilities]
cancel = true
partials = true
query = ["extract_map"]

[[contributes.solvers]]
id = "witwin.channel.path"
title = "Channel Path Solver"
entry = "solver_host.py"
lifecycle = "warm"
idleTimeoutSec = 300
cancelGraceSec = 5
maxParallel = 1

[contributes.solvers.runtime]
python = "${project:python}"
# The shared solver_host.py solves Paths when a config does not say "mode".
env = { WT_CHANNEL_SOLVER_MODE = "path" }

[contributes.solvers.capabilities]
cancel = true
partials = true
query = ["plot", "ray_batch"]

# A Project template (Studio's template cards). The payload is copied as-is;
# every file is checked against the content manifest, whose sha256 is pinned
# here. Rebuild both with studio/scripts/build-template-manifest.mjs.
[[contributes.templates]]
id = "channel-sim"
title = "Channel Sim"
description = "A 3.5 GHz transmitter and receiver between three buildings."
icon = "radio-tower"
version = "1.1.1"
dir = "templates/channel-sim"
manifest = "template.manifest.json"
sha256 = "41d2e5585cf1d714fbeb855fa894e2e6d8dc94fcb277032cf77f65b88b0de3e3"
